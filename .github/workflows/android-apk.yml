name: Rabbit Launcher APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "Hyper_Launcher_v3/**"
      - "ColorPicker/**"
      - "NoBlocklist/**"
      - "glfw/**"
      - "mojoexec/**"
      - "sdl/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle"
      - "build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rabbit-launcher-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build ARM64 debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Some source repositories are declared in .gitmodules but are not
      # recorded as gitlinks in this repository revision. Ensure Gradle's
      # required native modules are present before configuring the build.
      - name: Restore required source modules
        run: |
          set -e
          if [ ! -f sdl/android-gradle/build.gradle ]; then
            rm -rf sdl
            git clone --depth 1 https://github.com/ashmeet-op/HyperSDL.git sdl
          fi
          if [ ! -f glfw/android-gradle/build.gradle ]; then
            rm -rf glfw
            git clone --depth 1 --branch glfw34 https://github.com/ashmeet-op/glfw.git glfw
          fi
          if [ ! -f mojoexec/jni_bindings/build.gradle ]; then
            rm -rf mojoexec
            git clone --depth 1 https://github.com/ashmeet-op/Hyperexec.git mojoexec
          fi
          if [ ! -f NoBlocklist/build.gradle ]; then
            rm -rf NoBlocklist
            git clone --depth 1 https://github.com/MojoLauncher/NoBlocklist.git NoBlocklist
          fi
          # Use the Android Gradle Plugin version already declared by the root build.
          sed -i "s/id 'com.android.library' version '8.11.1'/id 'com.android.library'/" mojoexec/jni_bindings/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner publishes Android 37 as android-37.0, while this project's
      # Android Gradle Plugin requests the legacy android-37 directory.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Build Rabbit Launcher
        run: |
          chmod +x ./gradlew
          ./gradlew :Rabbit_Launcher:assembleFullDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rabbit-Launcher-0.1-beta-ARM64-debug
          path: Hyper_Launcher_v3/build/outputs/apk/full/debug/rabbit_launcher-0.1-beta-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30
