name: Import full Rabbit Launcher source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rabbit-launcher-source-import
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch original launcher and source dependencies
        shell: bash
        run: |
          git clone --depth 1 https://github.com/ashmeet-op/Hyper_Launcher_v3.git /tmp/hyper
          git -C /tmp/hyper submodule update --init --recursive
          git clone --depth 1 https://github.com/MojoLauncher/NoBlocklist.git /tmp/NoBlocklist

      - name: Import all tracked source and apply the Rabbit branding
        shell: bash
        run: |
          mkdir -p .github/workflows
          rsync -a --delete \
            --exclude='/.git' \
            --exclude='/.github/workflows/import-hyper-launcher.yml' \
            --exclude='/glfw/***' \
            --exclude='/sdl/***' \
            --exclude='/mojoexec/***' \
            --exclude='/NoBlocklist/***' \
            /tmp/hyper/ ./

          # Keep third-party submodules as proper Git submodule entries.
          git add -A
          for item in "glfw:/tmp/hyper/glfw" "sdl:/tmp/hyper/sdl" "mojoexec:/tmp/hyper/mojoexec" "NoBlocklist:/tmp/NoBlocklist"; do
            path="${item%%:*}"
            source="${item#*:}"
            sha="$(git -C "$source" rev-parse HEAD)"
            git update-index --add --cacheinfo "160000,$sha,$path"
          done

          # Small, display-only rebrand. Keep package IDs and native integration unchanged.
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "settings.gradle": [("rootProject.name='HyperLauncher'", "rootProject.name='RabbitLauncher'")],
              "Hyper_Launcher_v3/src/main/res/values/strings.xml": [
                  ("Hyper Launcher", "Rabbit Launcher"),
                  ("HyperLauncher", "RabbitLauncher"),
              ],
              "Hyper_Launcher_v3/src/main/java/com/ashmeet/hyperlauncher/utils/HyperUtils.kt": [
                  ('APP_NAME = "HyperLauncher"', 'APP_NAME = "RabbitLauncher"'),
              ],
              "Hyper_Launcher_v3/src/main/java/com/ashmeet/hyperlauncher/utils/DiscordRpcManager.kt": [
                  ('state: String = "HyperLauncher"', 'state: String = "RabbitLauncher"'),
                  ('name = "Hyper Launcher"', 'name = "Rabbit Launcher"'),
                  ('largeText = "HyperLauncher"', 'largeText = "RabbitLauncher"'),
                  ('Download HyperLauncher', 'Download Rabbit Launcher'),
              ],
              "Hyper_Launcher_v3/src/main/java/com/ashmeet/hyperlauncher/screens/home/about/AboutScreen.kt": [
                  ("Hyper Launcher 3", "Rabbit Launcher 3"),
                  ("Hyper Launcher", "Rabbit Launcher"),
                  ("https://github.com/hollowlauncher/Hyper_Launcher_v3/blob/master/README.md",
                   "https://github.com/khargosh-area/Rabbitlaunchs"),
              ],
          }

          for name, pairs in replacements.items():
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"Expected source file missing: {name}")
              data = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  data = data.replace(old, new)
              path.write_text(data, encoding="utf-8")

          readme = Path("README.md")
          if readme.exists():
              data = readme.read_text(encoding="utf-8")
              data = data.replace("Hyper Launcher", "Rabbit Launcher").replace("HyperLauncher", "RabbitLauncher")
              readme.write_text(data, encoding="utf-8")
          PY

          # Remove this one-time importer from the final source tree.
          rm -f .github/workflows/import-hyper-launcher.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import full Rabbit Launcher source [skip ci]"
          git push origin HEAD:main
